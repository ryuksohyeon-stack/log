<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새우튀김</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@100;200;400&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* =========================================================
   공통 레이아웃
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--page-bg);font-family:var(--f-body);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;--k:1;--W:1220;--H:640;--D:390;user-select:none;-webkit-user-select:none}
.bg{position:absolute;inset:0;pointer-events:none;z-index:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;z-index:2}
.stage{position:absolute;left:50%;top:50%;width:calc(var(--W) * 1px);height:calc(var(--H) * 1px);transform:translate(-50%,-50%) scale(var(--k));pointer-events:none;z-index:1}
.stage-front{z-index:1}   /* 글씨는 새우 뒤 (새우가 앞) */
.anchor{position:absolute;top:50%;width:0;height:0}
.anchor.l{left:calc(var(--W) * .5px - var(--D) * 1px)}
.anchor.r{left:calc(var(--W) * .5px + var(--D) * 1px)}
.anchor.c{left:calc(50% + var(--cx, 0) * 1px);top:calc(50% + var(--cy, 0) * 1px)}
/* 모바일(폭 760px 미만): 좌우 배치 그대로, 새우를 작게 줄여 가운데 글씨 칸 확보 */
.mobile .shadow{display:none}
.p{position:absolute;left:0;top:0;transform:translate(-50%,-50%) translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg));overflow:visible}

/* 키보드 접근용 버튼 (평소엔 보이지 않음) */
.hit{position:absolute;left:0;top:0;width:330px;height:330px;transform:translate(-50%,-50%);border-radius:50%;border:0;background:none;pointer-events:none;cursor:pointer;font:inherit;color:inherit}
.hit:focus-visible{outline:4px dashed var(--accent);outline-offset:6px}
.hit span{display:none}
.no3d .hit{pointer-events:auto;border:4px dashed var(--accent);background:rgba(255,255,255,.5)}
.no3d .hit span{display:block;font-family:var(--f-head);font-size:28px;color:var(--accent-dark)}

/* 안내 문구 */
.hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap;font-family:var(--f-head);font-size:13px;letter-spacing:.02em;color:var(--hint-color)}
.loading{position:absolute;left:50%;bottom:50%;transform:translate(-50%,50%);z-index:4;font-family:var(--f-head);color:var(--hint-color);font-size:14px;pointer-events:none}
.hint.gone,.loading.done{display:none}

/* =========================================================
   내용 (새우를 누르면 가운데 글씨 자리에 나타남)
   ========================================================= */
#info{position:absolute;left:calc(50% + var(--info-dx, 0px));top:calc(50% + var(--info-dy, 0px));transform:translate(-50%,-50%);z-index:1;display:none;width:var(--info-w,300px);word-break:keep-all;overflow-wrap:anywhere;max-height:var(--info-h,calc(100% - 40px));
  overflow:hidden;padding:6px 4px}
#app.reading #info{display:block}
#app.reading .title{visibility:hidden}
.c-step{font-family:var(--f-head);font-size:10px;letter-spacing:.3em;color:var(--accent)}
.c-title{font-family:var(--f-head);font-weight:var(--head-w);font-size:20px;line-height:1.2;letter-spacing:var(--title-ls);color:var(--title-ink);margin:6px 0 8px;text-wrap:balance}
.c-sub{font-size:11.5px;line-height:1.6;color:var(--sub-ink)}
.c-steps{list-style:none;counter-reset:st;display:grid;gap:8px;margin:14px 0}
.c-steps li{counter-increment:st;position:relative;padding-left:24px;font-size:12px;line-height:1.6}
.c-steps li:before{content:counter(st);position:absolute;left:0;top:2px;width:15px;height:15px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font:9px/13px var(--f-head);text-align:center}
.c-tip{font-size:11.5px;line-height:1.6;color:var(--accent-dark);border-top:1px solid var(--rule);padding-top:10px}
/* 모바일 내용 글씨: 7px */
#app.mobile .c-step,#app.mobile .c-sub,#app.mobile .c-tip,#app.mobile .c-steps li{font-size:7px}
#app.mobile .c-title{font-size:11px;margin:3px 0 4px}
#app.mobile .c-steps{gap:3px;margin:7px 0}
#app.mobile .c-steps li{padding-left:12px}
#app.mobile .c-steps li:before{top:1px;width:9px;height:9px;font-size:6px;line-height:8px}
#app.mobile .c-tip{padding-top:5px}

/* =========================================================
   시안별 스타일
   ========================================================= */
.v-b{--page-bg:#fff;--f-head:'Gothic A1',sans-serif;--f-body:'Gowun Dodum',sans-serif;--ink:#2e2724;
  --accent:#e2553a;--accent-dark:#c23f26;--hint-color:#b5aaa4;
  --step-ink:#e2553a;--step-shadow:none;--chip-radius:2px;--title-ink:#2e2724;--title-ls:-.02em;--head-w:200;
  --box-bg:transparent;--box-border:0;--box-radius:0;
  --chip-bg:transparent;--chip-border:1px solid #e3d6ce;--chip-ink:#6b5d56;
  --num-ink:#e2553a;--num-bg:transparent;--num-border:1px solid #e2553a;--num-shadow:none;
  --tip-bg:#fff5f1;--tip-border:0;--star:#e2553a;--star-shadow:none;
  --btn-radius:2px;--btn-border:1px solid #2e2724;--btn-ink:#2e2724;--btn-shadow:none;--close-bg:transparent;--close-ink:#2e2724}
.v-b{--sub-ink:#8a7d76;--rule:#eee5e0}
.v-b .c-title{font-size:21px}
.v-b .bg{background:#fff}
.v-b .title-b{text-align:center;color:#2e2724;white-space:nowrap}
.v-b .tb-v{position:relative;padding:8px 14px}
.v-b .tb-v span{display:block;font:100 62px/1.08 'Gothic A1',sans-serif}
.v-b .tb-v.grid{display:grid;grid-template-columns:1fr 1fr;padding:8px 10px}
.v-b .tb-v.grid span{font-size:50px;line-height:1.1;letter-spacing:-.04em}
.v-b .tb-v:before,.v-b .tb-v:after{content:"";position:absolute;width:26px;height:26px;border:1px solid #2e2724}
.v-b .tb-v:before{left:0;top:0;border-right:0;border-bottom:0}
.v-b .tb-v:after{right:0;bottom:0;border-left:0;border-top:0}
.v-b .tb-en{font:200 10px/1 'Gothic A1',sans-serif;letter-spacing:.5em;margin:14px 0 0 .5em;color:#8a7d76}
.v-b .tb-seal{position:absolute;right:-22px;top:58px;width:20px;height:20px;background:#e2553a;color:#fff;font:400 12px/20px serif;border-radius:2px;opacity:.9}
</style>
</head>
<body class="v-b">

<div id="app">
  <div class="bg"></div>

  <div class="stage stage-back">
    <div class="anchor l"></div>
    <div class="anchor c"></div>
    <div class="anchor r"></div>
  </div>

  <canvas id="scene" aria-label="3D 깐 새우와 새우튀김. 새우를 누르면 가운데에 내용이 나오고, 드래그하면 돌려볼 수 있어요."></canvas>
  

  <div class="stage stage-front">
    <div class="anchor l"><button class="hit" data-open="2" aria-label="깐 새우 내용 보기"><span>깐 새우</span></button></div>
    <div class="anchor c"><div class="p title-b title" style="--x:0px;--y:-6px;--r:0deg;"><div class="tb-v grid"><span>새</span><span>우</span><span>튀</span><span>김</span></div><div class="tb-en">TEMPURA</div><div class="tb-seal">天</div></div></div>
    <div class="anchor r"><button class="hit" data-open="1" aria-label="새우튀김 내용 보기"><span>새우튀김</span></button></div>
  </div>

  <!-- 새우를 누르면 가운데 제목 자리에 내용이 나타남 -->
  <section id="info" aria-live="polite"></section>

  <div class="loading">loading…</div>
  <div class="hint">새우를 눌러 보세요</div>
</div>

<!-- =========================================================
     내용 1 : 오른쪽(새우튀김)을 누르면 가운데에 나와요
     ========================================================= -->
<template id="content-1">
  <p class="c-step">STEP 2</p>
  <h2 class="c-title">바삭하게 튀기기</h2>
  <p class="c-sub">밀가루 · 달걀 1개 · 빵가루 · 튀김기름</p>
  <ol class="c-steps">
    <li>새우에 밀가루를 얇게 묻혀요.</li>
    <li>풀어 둔 달걀물에 담갔다 빼요.</li>
    <li>빵가루를 꾹꾹 눌러 입혀요.</li>
    <li>170℃ 기름에서 2~3분 노릇하게 튀겨요.</li>
    <li>망에 세워 기름을 빼면 완성!</li>
  </ol>
  <p class="c-tip">세워서 기름을 빼면 눅눅해지지 않아요.</p>
</template>

<!-- =========================================================
     내용 2 : 왼쪽(깐 새우)을 누르면 가운데에 나와요
     ========================================================= -->
<template id="content-2">
  <p class="c-step">STEP 1</p>
  <h2 class="c-title">튀김용 손질</h2>
  <p class="c-sub">튀기기 전에 깐 새우를 준비해요.</p>
  <ol class="c-steps">
    <li>등 쪽 내장을 빼요.</li>
    <li>꼬리 끝을 잘라 칼등으로 물기를 훑어내요.</li>
    <li>배 쪽에 칼집을 3~4번 넣어요.</li>
    <li>키친타월로 물기를 꼼꼼히 닦아요.</li>
  </ol>
  <p class="c-tip">녹말가루와 소금으로 씻으면 비린내가 빠져요.</p>
</template>

  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js'
];

var $ = function (q, el) { return (el || document).querySelector(q); };
var app = $('#app'), canvas = $('#scene'), info = $('#info');
var hint = $('.hint'), loading = $('.loading');
var L = { W: 1220, H: 640, D: 390, k: 1, vw: 1, vh: 1 };
var current = 0;

   화면 크기에 맞춰 전체를 자동으로 맞춤
   --------------------------------------------------------- */
function layout() {
  var vw = app.clientWidth || innerWidth, vh = app.clientHeight || innerHeight;
  var mobile = vw < 760;
  L.vw = vw; L.vh = vh; L.mobile = mobile;
  // 가로 화면: 좌우 배치 / 세로 화면: 위아래 배치 (D = 가운데에서 새우 중심까지, 디자인 px)

  app.style.setProperty('--W', L.W);

  // 새우튀김 얼굴 스티커 — 표면에 붙지 않은 납작한 평면
  if (P.fry && CFG.sticker) {
    // 좌우 반전된 새우는 뒷면(-Z)에 붙이고 돌려서, 화면에서는 항상 앞을 보게 함
    var Fh = frameAt(0.1, P.sh), back = def && def.mirror ? -1 : 1;
    var st = new T.Mesh(new T.PlaneGeometry(1.5, 0.75), new T.MeshBasicMaterial({ map: texture(paintSticker()), transparent: true, depthWrite: false, toneMapped: false }));
    st.position.set(Fh.c.x - 0.42 * back, Fh.c.y, back * (P.R0 * P.width + 0.24));   // 화면에서 살짝 왼쪽으로
    if (back < 0) st.rotation.y = Math.PI;
    st.renderOrder = 2; st.userData.noExtent = true;   // 얼굴은 크기·자리 계산에서 빼요 (옮겨도 새우가 따라 움직이지 않게)
    model.add(st);
  }

  var base = new T.Group(); base.add(model);
  var spin = new T.Group(); spin.add(base);
  var holder = new T.Group(); holder.add(spin);
  scene.add(holder);
  return { kind: kind, holder: holder, spin: spin, base: base, model: model, hitR: sph.radius * 0.9, meshes: [] };
}

/* ---------------------------------------------------------
   조명 / 환경맵
   --------------------------------------------------------- */
function makeEnv() {
  var pm = new T.PMREMGenerator(renderer), es = new T.Scene();
  es.add(new T.Mesh(new T.BoxGeometry(12, 12, 12), new T.MeshBasicMaterial({ color: new T.Color(CFG.envWall).multiplyScalar(0.5), side: T.BackSide })));
  function panel(w, h, p, k, col) {
    var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(col || '#ffffff').multiplyScalar(k), side: T.DoubleSide }));
    m.position.set(p[0], p[1], p[2]); m.lookAt(0, 0, 0); es.add(m);
  }
  panel(5, 3, [-3, 4.5, 4], 9);
  panel(3, 4, [5, 1, -2], 4);
  panel(8, 1.6, [0, -5, 1], 2.4, CFG.envFloor);
  panel(2, 6, [-5.5, 0, -1], 2.5);
  panel(4, 2, [2, 5.5, -3], 3);
  var tex = pm.fromScene(es, 0.035).texture; pm.dispose();
  return tex;
}
function addLights() {
  var Lc = CFG.light;
  scene.add(new T.HemisphereLight(Lc.sky, Lc.ground, Lc.hemi));
  var key = new T.DirectionalLight(0xffffff, Lc.key); key.position.set(-3, 5, 6); scene.add(key);
  var fill = new T.DirectionalLight(Lc.fillColor, Lc.fill); fill.position.set(5, -2, 4); scene.add(fill);
  var rim = new T.DirectionalLight(0xffffff, Lc.rim); rim.position.set(3, 4, -6); scene.add(rim);
  KEYDIR = key.position.clone().normalize();
}

/* ---------------------------------------------------------
   시작
   --------------------------------------------------------- */
function init() {
  T = window.THREE;
  try {
    renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { return fail(); }
  if (!renderer.getContext()) return fail();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = CFG.aces ? T.ACESFilmicToneMapping : T.NoToneMapping;
  renderer.toneMappingExposure = CFG.exposure;
  renderer.setClearColor(0x000000, 0);
  scene = new T.Scene();
  camera = new T.PerspectiveCamera(30, 1, 0.1, 400);
  addLights();
  if (CFG.style !== 'toon') scene.environment = makeEnv();

  var D2R = Math.PI / 180, Y = new T.Vector3(0, 1, 0), Z = new T.Vector3(0, 0, 1);
  function place(def, side, content, seed) {
    var s = makeShrimp(def.kind, CFG.parts[def.kind], seed, def);
    s.side = side; s.content = content;
    s.base.quaternion.setFromEuler(new T.Euler(def.home[0] * D2R, def.home[1] * D2R, 0))
      .multiply(new T.Quaternion().setFromAxisAngle(Z, def.home[2] * D2R));
    if (def.mirror) s.base.quaternion.multiply(new T.Quaternion().setFromAxisAngle(Y, Math.PI));
    s.base.scale.setScalar(def.scale || 1);
    return s;
  }
  // 왼쪽 = 내용 2, 오른쪽 = 내용 1 (왼쪽은 1번 사진처럼 좌우 반전 + 회전)
  shrimps = [place(CFG.left, -1, 2, 5), place(CFG.right, 1, 1, 11)];
  shrimps.forEach(function (s) {
    s.model.traverse(function (o) { if (o.isMesh && o.material.side !== T.BackSide) s.meshes.push(o); });
  });

  // 새우마다 가운데에서 좌우 끝까지의 거리 (가운데 내용 칸 너비 계산용)
  shrimps.forEach(function (s) { s.ext = extent(s); });
  // 오른쪽 새우튀김을 왼쪽 깐 새우와 같은 크기로 — 화면에 차지하는 넓이(가로×세로)를 맞춰요
  (function () {
    var a = shrimps[0].ext, b = shrimps[1], e = b.ext;
    var k = Math.sqrt(((a.x[1] - a.x[0]) * (a.y[1] - a.y[0])) / ((e.x[1] - e.x[0]) * (e.y[1] - e.y[0])));
    b.base.scale.multiplyScalar(k); b.hitR *= k;
    b.ext = extent(b);
  })();
  layout();
  bindInput();
  loading.classList.add('done');
}
function extent(s) {
  var e = { x: [Infinity, -Infinity], y: [Infinity, -Infinity] }, v = new T.Vector3(), o0 = s.holder.position;
  s.holder.updateMatrixWorld(true);
  s.holder.traverse(function (o) {
    if (!o.isMesh || o.material.side === T.BackSide || o.userData.noExtent) return;
    var p = o.geometry.attributes.position;
    for (var i = 0; i < p.count; i++) {   // 꼭짓점을 다 재야 빵가루 끝까지 크기에 들어가요
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).sub(o0);
      if (v.x < e.x[0]) e.x[0] = v.x; if (v.x > e.x[1]) e.x[1] = v.x;
      if (v.y < e.y[0]) e.y[0] = v.y; if (v.y > e.y[1]) e.y[1] = v.y;
    }
  });
  return e;
}
function fail() {
  app.classList.add('no3d');
  loading.textContent = CFG.failText;
}

/* ---------------------------------------------------------
   입력 : 드래그 = 360° 회전, 탭 = 내용 열기
   --------------------------------------------------------- */
var ray, ndc, sphere;
function pick(x, y, precise) {
  var r = canvas.getBoundingClientRect();
  ndc.set((x - r.left) / r.width * 2 - 1, -(y - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  var best = null, bd = Infinity;
  shrimps.forEach(function (s) {
    var hit = precise ? ray.intersectObjects(s.meshes, false)[0] : null;
    var d = hit ? hit.distance : Infinity;
    if (!hit) {
      sphere.set(s.holder.getWorldPosition(tmpV), s.hitR * s.holder.scale.x);
      var p = ray.ray.intersectSphere(sphere, new T.Vector3());
      if (p) d = p.distanceTo(ray.ray.origin) + 50;
    }
    if (d < bd) { bd = d; best = s; }
  });
  return best;
}
function bindInput() {
  ray = new T.Raycaster(); ndc = new T.Vector2(); sphere = new T.Sphere(); dq = new T.Quaternion(); tmpV = new T.Vector3();
  var ptr = null;
  canvas.addEventListener('pointerdown', function (e) {
    if (ptr) return;
    hint.classList.add('gone');
    var s = pick(e.clientX, e.clientY, true);
    ptr = { id: e.pointerId, s: s, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    if (s) canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!ptr) {
      if (e.pointerType === 'mouse') canvas.style.cursor = pick(e.clientX, e.clientY, false) ? 'pointer' : '';
      return;
    }
    if (e.pointerId !== ptr.id) return;
    var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (!ptr.moved && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 7) ptr.moved = true;
    if (ptr.moved && ptr.s && (dx || dy)) {
      dq.setFromAxisAngle(new T.Vector3(dy, dx, 0).normalize(), Math.hypot(dx, dy) * 7 / Math.min(L.vw, 900));
      ptr.s.spin.quaternion.premultiply(dq);
      requestRender();
    }
    ptr.x = e.clientX; ptr.y = e.clientY;
  });
  function end(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.moved && e.type === 'pointerup') { if (ptr.s) open(ptr.s.content); else if (current) close(); }
    ptr = null; canvas.style.cursor = '';
  }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

/* ---------------------------------------------------------
   내용 : 새우를 누르면 제목 대신 내용, 같은 새우나 빈 곳을 누르면 다시 제목
   --------------------------------------------------------- */
function open(n) {
  if (current === n) return close();
  var tpl = document.getElementById('content-' + n);
  if (!tpl) return;
  info.innerHTML = '';
  info.appendChild(tpl.content.cloneNode(true));
  info.scrollTop = 0;
  current = n;
  app.classList.add('reading');
  hint.classList.add('gone');
  relayout();
}
function close() { current = 0; app.classList.remove('reading'); relayout(); }
// 내용의 원래 너비 (화면에 보이지 않게 재기)
var measureBox;
function contentWidth(n, cap) {
  if (!measureBox) {
    measureBox = document.createElement('div');
    measureBox.setAttribute('aria-hidden', 'true');
    measureBox.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;width:max-content;padding:6px 4px;word-break:keep-all';
    app.appendChild(measureBox);
  }
  var tpl = document.getElementById('content-' + n), m = 0;
  if (tpl) {
    measureBox.appendChild(tpl.content.cloneNode(true));
    m = measureBox.getBoundingClientRect().width;
    measureBox.innerHTML = '';
  }
  return Math.min(cap, Math.ceil(m));
}
// 가운데 글씨 너비가 바뀌면 새우 간격도 다시 맞춤
function relayout() { if (shrimps.length) { placeInfo(); requestRender(); } }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
Array.prototype.forEach.call(document.querySelectorAll('.hit'), function (b) {
  b.addEventListener('click', function () { open(+b.getAttribute('data-open')); });
});

window.addEventListener('resize', layout);
// 글꼴이 늦게 도착하면 글씨 너비가 바뀌므로 다시 재기
if (document.fonts) {
  if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { layout(); });
  if (document.fonts.ready) document.fonts.ready.then(function () { layout(); });
}
window.addEventListener('load', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
layout();

/* three.js 불러오기 (CDN 여러 곳 순서대로 시도) */
(function load(i) {
  if (window.THREE) return init();
  if (i >= THREE_SRC.length) return fail();
  var sc = document.createElement('script');
  sc.src = THREE_SRC[i];
  sc.onload = function () { window.THREE ? init() : load(i + 1); };
  sc.onerror = function () { load(i + 1); };
  document.head.appendChild(sc);
})(0);
})();
</script>
</body>
