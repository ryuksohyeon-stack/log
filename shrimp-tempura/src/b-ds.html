<!-- 새우튀김 만들기 · 시안 B 「투 스크린 게임기」
     luvinfo › 새 HTML 페이지에 이 파일을 통째로 붙여 넣어요.
     · 위 화면은 단계 · 팁 · 점수, 아래 화면은 누르는 요리판이에요.
     · 컴퓨터: 페이지 폭을 「넓게」나 「화면 꽉 채움」으로 고르면 게임기가 왼쪽, 글이 오른쪽에 놓여요.
     · 폰: 게임기가 위, 글이 아래. 게임기는 화면 폭과 높이에 맞춰 통째로 줄어요.
     · 글은 아래 <article> 안만 고치면 돼요. -->
<style>
/*@ENGINE_CSS@*/
.ckB,.ckB *{box-sizing:border-box}
.ckB{--ink:#2b3467;--coral:#ff6f91;--sky:#dff1fb;container-type:inline-size;margin:0 auto;padding:22px 12px 24px;border-radius:30px;color:var(--ink);
  font-family:'IyagiGGC',sans-serif;font-synthesis:none;word-break:keep-all;
  background:radial-gradient(circle,#fff 2.2px,transparent 2.8px) 0 0/22px 22px,radial-gradient(circle,#fff 2.2px,transparent 2.8px) 11px 11px/22px 22px,linear-gradient(#cfeaf9,#e8f5fd)}
.ckB-grid{display:grid;gap:26px}
.ckB-cook{min-width:0}
/* 게임기 — 위 · 아래 두 몸통과 경첩 */
.ckB-ds{width:min(100%,50vh);margin:0 auto;filter:drop-shadow(0 16px 20px rgb(43 52 103/.22))}
.ckB-half{position:relative;padding:5.5cqi 7cqi;border-radius:7cqi;background:linear-gradient(160deg,#fff 0%,#fbeef3 55%,#f4dfe8 100%);box-shadow:inset 0 0 0 .7cqi #fff,inset 0 -1.4cqi 0 rgb(230 160 190/.35),0 0 0 .6cqi #f2c4d4}
.ckB-ds{container-type:inline-size}
.ckB-top{border-radius:7cqi 7cqi 4cqi 4cqi;padding-bottom:4.5cqi}
.ckB-bot{border-radius:4cqi 4cqi 7cqi 7cqi;padding-top:4.5cqi;padding-bottom:9cqi}
.ckB-hinge{position:relative;height:5cqi;margin:-.4cqi 9cqi;border-radius:2.5cqi;background:linear-gradient(#f1cfdc,#fff 45%,#e9bccd);box-shadow:inset 0 0 0 .4cqi #f2c4d4}
.ckB-hinge:before,.ckB-hinge:after{content:"";position:absolute;top:1.2cqi;width:2.6cqi;height:2.6cqi;border-radius:50%;background:#8fe08a;box-shadow:0 0 1.4cqi #8fe08a,inset 0 0 0 .3cqi #fff}
.ckB-hinge:before{left:4cqi}.ckB-hinge:after{left:8.5cqi;background:#ffb3c7;box-shadow:inset 0 0 0 .3cqi #fff}
.ckB-scr{position:relative;border-radius:2.6cqi;padding:1.6cqi;background:var(--ink);box-shadow:inset 0 0 0 .5cqi #3d4785,0 .5cqi 0 #fff}
.ckB-scr>*{border-radius:1.4cqi;overflow:hidden}
.ckB-spk{position:absolute;top:3cqi;left:50%;transform:translateX(-50%);display:flex;gap:1.4cqi}
.ckB-spk i{width:1.2cqi;height:1.2cqi;border-radius:50%;background:#e7b8c8}
.ckB-logo{position:absolute;left:0;right:0;bottom:2.4cqi;text-align:center;font:2.6cqi/1 'IyagiGGC',sans-serif;letter-spacing:.3em;color:#e59ab4}
.ckB-pad{position:absolute;bottom:2.6cqi;display:flex;gap:2cqi}
.ckB-pad.l{left:7cqi}.ckB-pad.r{right:7cqi}
.ckB-pad i{width:4.6cqi;height:4.6cqi;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd0de);box-shadow:0 .5cqi 0 #e7a6bd,inset 0 0 0 .3cqi #fff}
.ckB-pad.l i{border-radius:1.2cqi;background:radial-gradient(circle at 35% 30%,#fff,#cfe9fb);box-shadow:0 .5cqi 0 #9fcbe8}
/* 위 화면 — 정보창 */
.ckB-info{position:relative;aspect-ratio:6/5;container-type:inline-size;color:var(--ink);font-family:'IyagiGGC',sans-serif;
  background:linear-gradient(90deg,rgb(255 255 255/.5) 50%,transparent 0) 0 0/8cqi 8cqi,linear-gradient(rgb(255 255 255/.5) 50%,transparent 0) 0 0/8cqi 8cqi,#fff2d6}
.ckB-info>section{position:absolute;inset:0;display:none;flex-direction:column;padding:4.5cqi 5cqi}
.ckB-info[data-v=title] .v-title,.ckB-info[data-v=game] .v-game,.ckB-info[data-v=final] .v-final{display:flex}
.v-title{align-items:center;justify-content:center;text-align:center;gap:2.4cqi}
.v-title h3{margin:0;font:400 12cqi/1.08 'IyagiGGC',sans-serif;color:var(--coral);text-shadow:0 1.1cqi 0 var(--ink)}
.v-title p{margin:0;font-size:4.6cqi}
.v-title .chip{padding:1.4cqi 3.6cqi;border-radius:99px;background:var(--ink);color:#fff;font-size:4cqi}
.v-title .best{font-size:4.2cqi;color:#b15b78}
.v-title .best b{font-weight:400;color:var(--ink)}
.v-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.6cqi}
.v-head b{padding:1.2cqi 3.4cqi;border-radius:99px;background:var(--coral);color:#fff;font-weight:400;font-size:4.6cqi;box-shadow:0 0 0 .6cqi var(--ink)}
.v-head span{font-size:4.4cqi}
.v-steps{list-style:none;margin:0;padding:0;display:grid;gap:1.6cqi}
.v-steps li{display:flex;align-items:center;gap:2.4cqi;padding:1.6cqi 2.6cqi;border-radius:2.4cqi;background:rgb(255 255 255/.75);font-size:5cqi;box-shadow:0 0 0 .5cqi rgb(43 52 103/.15)}
.v-steps li i{display:grid;place-items:center;width:6.4cqi;height:6.4cqi;flex:none;border-radius:50%;background:#e6e9f2;font-style:normal;font-size:3.8cqi}
.v-steps li em{margin-left:auto;font-style:normal;font-size:4.4cqi;letter-spacing:.05em;color:#c9cfdf}
.v-steps li em .on{color:#ffbf1f}
.v-steps li.now{background:#fff;box-shadow:0 0 0 .7cqi var(--coral)}
.v-steps li.now i{background:var(--coral);color:#fff}
.v-steps li.done i{background:#7fd38a;color:#fff}
.v-tip{margin:auto 0 0;padding:2cqi 3cqi;border-radius:2.4cqi;background:var(--ink);color:#fff;font:4cqi/1.45 'IyagiGGC',sans-serif}
.v-tip b{color:#ffd23f;font:400 4cqi 'IyagiGGC',sans-serif;margin-right:1.4cqi}
.v-hits{display:flex;gap:1.2cqi;min-height:3.4cqi;margin:2.2cqi 0 0}
.v-hits i{width:3.4cqi;height:3.4cqi;border-radius:50%;box-shadow:0 0 0 .4cqi #fff}
.v-final{align-items:center;justify-content:center;text-align:center;gap:2cqi}
.v-final .m{font-size:6cqi;color:var(--coral)}
.v-final .s{font-size:17cqi;line-height:1}
.v-final .s small{font-size:7cqi}
.v-final .msg{max-width:84%;font-size:4.6cqi;line-height:1.4}
.v-final .best{font-size:4cqi;color:#b15b78}
/* 메모 · 글 */
.ckB .ck-memo{margin:20px auto 0;max-width:520px;padding:14px 16px;border-radius:18px;background:#fff;box-shadow:0 0 0 2px #bfe0f3,0 8px 18px rgb(43 52 103/.08)}
.ckB .ck-memo-t{margin:0 0 6px;font:13px/1 'IyagiGGC',sans-serif;letter-spacing:.12em;color:var(--coral)}
.ckB .ck-memo ul{margin:0 0 8px;padding:0;list-style:none}
.ckB .ck-memo li{display:flex;gap:8px;font-size:13.5px;line-height:1.6;margin-bottom:4px}
.ckB .ck-memo li b{flex:none;min-width:44px;font:400 13.5px/1.6 'IyagiGGC',sans-serif}
.ckB .ck-best{margin:0;font:14px/1.4 'IyagiGGC',sans-serif;color:#7d86b3}
.ckB .ck-best b{font-weight:400;color:var(--ink)}
.ckB .ck-post{border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px #bfe0f3,0 14px 30px rgb(43 52 103/.12)}
.ckB .ck-head{position:relative;padding:22px 22px 20px;background:linear-gradient(135deg,#ff8aa8,#ff6f91);color:#fff}
.ckB .ck-head:after{content:"";position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 30%,transparent 31%),rgb(255 255 255/.25)}
.ckB .ck-kicker{margin:0 0 8px;font:13px/1.2 'IyagiGGC',sans-serif;letter-spacing:.1em}
.ckB .ck-h1{margin:0 0 10px;font:400 clamp(28px,7.4cqi,38px)/1.15 'IyagiGGC',sans-serif}
.ckB .ck-lead{margin:0;font-size:15px;line-height:1.8;opacity:.95}
.ckB .ck-sec{position:relative;margin:0;padding:20px 22px 6px;border-top:1px dashed #d6e6f2}
.ckB .ck-head+.ck-sec{border-top:0}
.ckB .ck-h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:400 20px/1.25 'IyagiGGC',sans-serif}
.ckB .ck-h2 b{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:9px;background:var(--ink);color:#fff;font-weight:400;font-size:16px;box-shadow:0 3px 0 #ff9fb6}
.ckB .ck-sec p{margin:0 0 12px;font-size:15px;line-height:1.85;color:#3b4372}
.ckB .ck-sec.ck-now{background:#fff6f9}
.ckB .ck-sec.ck-now:before{content:"▶ NOW PLAYING";position:absolute;right:20px;top:24px;font:11px/1 'IyagiGGC',sans-serif;letter-spacing:.1em;color:var(--coral)}
.ckB .ck-outro{margin:0;padding:18px 22px 10px;border-top:1px dashed #d6e6f2;font:17px/1.5 'IyagiGGC',sans-serif;text-align:center;color:#7d86b3}
.ckB .ck-go{display:block;margin:4px auto 24px;padding:13px 24px;border:0;border-radius:14px;cursor:pointer;font:18px/1 'IyagiGGC',sans-serif;color:#fff;background:var(--ink);box-shadow:0 5px 0 #ff6f91;transition:transform .12s}
.ckB .ck-go:active{transform:translateY(4px);box-shadow:0 1px 0 #ff6f91}
.ckB-ds .ck-stage{--ck-accent:#ff6f91;--ck-title:#ff7e9c;--ck-wall:#9fd6f2;--ck-wall2:#7cc3ea}
@container (min-width:720px){
  .ckB{padding:30px 26px 32px}
  .ckB-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:30px}
  .ckB .ck-head{padding:28px 30px 24px}
  .ckB .ck-sec{padding:22px 30px 8px}
  .ckB .ck-outro{padding:20px 30px 10px}
}
</style>
<div class="ckB">
  <div class="ckB-grid">
    <div class="ckB-cook">
      <div class="ckB-ds">
        <div class="ckB-half ckB-top">
          <div class="ckB-spk"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="ckB-scr">
            <div class="ckB-info" id="ckInfo" data-v="title" aria-live="polite">
              <section class="v-title">
                <h3>새우튀김<br>만들기</h3>
                <p>아래 화면의 「게임 시작」을 눌러요</p>
                <span class="chip">TAP! TAP! 쿠킹 · 4단계</span>
                <p class="best">최고 기록 <b data-ck-best>아직 없어요</b></p>
              </section>
              <section class="v-game">
                <div class="v-head"><b class="v-no">STEP 1/4</b><span class="v-name">새우 손질</span></div>
                <ol class="v-steps">
                  <li><i>1</i>새우 손질<em></em></li>
                  <li><i>2</i>튀김옷 입히기<em></em></li>
                  <li><i>3</i>튀기기<em></em></li>
                  <li><i>4</i>플레이팅<em></em></li>
                </ol>
                <div class="v-hits"></div>
                <p class="v-tip"><b>TIP</b><span class="v-tiptx"></span></p>
              </section>
              <section class="v-final">
                <span class="m"></span>
                <span class="s"></span>
                <span class="msg"></span>
                <span class="best">최고 기록 <b data-ck-best>아직 없어요</b></span>
              </section>
            </div>
          </div>
        </div>
        <div class="ckB-hinge"></div>
        <div class="ckB-half ckB-bot">
          <div class="ckB-scr">
            /*@STAGE_NOTITLE@*/
          </div>
          <div class="ckB-pad l"><i></i><i></i></div>
          <div class="ckB-pad r"><i></i><i></i></div>
          <div class="ckB-logo">SHRIMP · TEMPURA</div>
        </div>
      </div>
      /*@MEMO@*/
    </div>
    /*@ARTICLE@*/
  </div>
</div>
<script>
/* 위 화면(정보창)을 게임 진행에 맞춰 바꿔요 */
window.ckHooks = (() => {
  const box = document.getElementById('ckInfo');
  const $ = (s) => box.querySelector(s), li = [...box.querySelectorAll('.v-steps li')];
  const COL = { P: '#3db5ff', G: '#ffd23f', B: '#ff7a7a', M: '#c9cfdf' };
  const stars = (n) => '<span class="on">' + '★'.repeat(n) + '</span>' + '☆'.repeat(3 - n);
  return {
    mode(m) { box.dataset.v = m === 'title' ? 'title' : m === 'final' ? 'final' : 'game'; },
    recipe() {
      li.forEach((e, k) => { e.className = ''; e.querySelector('em').innerHTML = ''; e.querySelector('i').textContent = k + 1; });
      $('.v-no').textContent = 'RECIPE'; $('.v-name').textContent = '새우튀김 2인분'; $('.v-hits').innerHTML = '';
      $('.v-tiptx').textContent = '아래 화면에서 재료와 순서를 보고 TAP 하면 시작해요.';
    },
    step(i, st) {
      li.forEach((e, k) => e.classList.toggle('now', k === i));
      $('.v-no').textContent = `STEP ${i + 1}/4`; $('.v-name').textContent = st.name; $('.v-tiptx').textContent = st.tip; $('.v-hits').innerHTML = '';
    },
    judge(i, tier) { $('.v-hits').insertAdjacentHTML('beforeend', `<i style="background:${COL[tier]}"></i>`); },
    stepEnd(i, n) { li[i].classList.remove('now'); li[i].classList.add('done'); li[i].querySelector('i').textContent = '✓'; li[i].querySelector('em').innerHTML = stars(n); },
    final(r) { $('.v-final .m').textContent = r.medal ? (r.best ? '🎉 ' : '') + r.medal + '!' : '조금만 더!'; $('.v-final .s').innerHTML = `${r.total}<small>점</small>`; $('.v-final .msg').textContent = r.message; },
  };
})();
/*@ENGINE_JS@*/
</script>
