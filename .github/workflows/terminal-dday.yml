# 한국 시간 자정이 지나면 디데이 그림(terminal/dday.png)을 새 숫자로 다시 그려요.
# luvlinks 프로필 CSS(terminal/profile.css)가 raw.githubusercontent.com/…/HEAD/terminal/dday.png 를 불러와서 디데이가 매일 바뀌어요.
# 예약 실행은 기본 브랜치에 이 파일이 있어야 돌아가요. Actions 탭에서 「Run workflow」로 바로 돌릴 수도 있어요.
name: Terminal D-day

on:
  schedule:
    - cron: '1 15 * * *'    # 한국 00:01
    - cron: '43 15 * * *'   # 예약이 밀렸을 때를 대비해 한 번 더
  workflow_dispatch:
  push:
    paths:
      - terminal/dday.mjs
      - .github/workflows/terminal-dday.yml

permissions:
  contents: write

concurrency:
  group: terminal-dday
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Draw today's D-day
        run: node terminal/dday.mjs
      - name: Commit if the number changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/dday.png
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Terminal D-day $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
