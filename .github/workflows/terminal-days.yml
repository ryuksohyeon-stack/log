# 터미널 프로필의 기념일 그림(terminal/anniv.png)을 다시 그려요. 한국 자정이 지날 때마다 한 번씩.
# luvlinks 프로필 CSS(terminal/profile.css)가 raw.githubusercontent.com/…/HEAD/terminal/ 에서 불러가요.
# 예약 실행은 기본 브랜치에 이 파일이 있어야 돌아가요. Actions 탭에서 「Run workflow」로 바로 돌릴 수도 있어요.
name: Terminal days

on:
  schedule:
    - cron: '1 15 * * *'    # 한국 00:01
    - cron: '37 15 * * *'   # 예약이 밀렸을 때를 대비해 한 번 더
  workflow_dispatch:
  push:
    paths:
      - terminal/days.mjs
      - .github/workflows/terminal-days.yml

permissions:
  contents: write

concurrency:
  group: terminal-days
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Draw today's anniversary
        run: node terminal/days.mjs
      - name: Commit if the picture changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/anniv.png
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Terminal days $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
