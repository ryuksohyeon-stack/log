<link rel=stylesheet href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e1e5f0}
svg{display:block;width:100%;height:100%;font-family:Pretendard,sans-serif}
.ru{font-family:"Russo One",Pretendard,sans-serif}
.px{shape-rendering:crispEdges}
.nt{opacity:1}.day .nt{opacity:0}
.lit,.on{opacity:0}.open .lit,.open .on{opacity:1}.open .off{opacity:0}
.bk{fill:#1a2240}.day .bk{fill:#a6b0c8}
.wn{fill:#262f50}.day .wn{fill:#8892ad}
.neon{fill:#4b2c22}.open .neon{fill:#ff4f14;filter:url(#gl)}
.bulb{stroke:#4b3a30}.open .bulb{stroke:#ffd27a;animation:chase 1s steps(2) infinite}
.win{fill:#2b3048}.open .win{fill:#ffd27a}
.dot{fill:#e8323c}.now .dot{fill:#1fae7b}
.ready .nt,.ready .lit,.ready .on,.ready .off{transition:opacity 1.6s}
.ready .bk,.ready .wn,.ready .neon,.ready .win{transition:fill 1.6s}
.sh{transition:transform 3.4s cubic-bezier(.55,0,.35,1)}.open .sh{transform:translateY(-178px)}
.smk{transform-box:fill-box;transform-origin:center;animation:smk 6s linear infinite}
.sw{transform-box:view-box;animation:sway 4s ease-in-out infinite alternate}
.tap{transform-box:fill-box;transform-origin:50% 100%;animation:tap .8s ease-in-out infinite alternate}
.sp{animation:sp 1.3s steps(1) infinite}
.tw{animation:tw 3s ease-in-out infinite alternate}
.au{animation:tw 7s ease-in-out infinite alternate}
.bl{animation:bl 1s steps(1) infinite}
.snow,.snow:after{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 7px 9px,#fff 1.2px,#0000 1.9px) 0 0/37px 41px,radial-gradient(circle at 21px 3px,#fffc 1px,#0000 1.7px) 0 0/53px 47px;animation:fa 7s linear infinite}
.snow:after{content:"";background:radial-gradient(circle at 13px 11px,#fff 1.8px,#0000 2.7px) 0 0/71px 67px;animation:fb 5s linear infinite}
@keyframes fa{to{background-position:20px 41px,-12px 47px}}
@keyframes fb{to{background-position:16px 67px}}
@keyframes smk{0%{opacity:0;transform:scale(.5)}20%{opacity:.9}to{opacity:0;transform:translate(22px,-56px) scale(2.4)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes tap{to{transform:rotate(14deg)}}
@keyframes sp{50%{opacity:0}}
@keyframes tw{to{opacity:.35}}
@keyframes bl{50%{opacity:0}}
@keyframes chase{50%{stroke-dashoffset:5}}
</style>

<script>
(function(){
var H=document.documentElement,O=600,C=1020,K=324e5,D=864e5,off=0,first=1,
at=/^(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('at')||'');
if(at)off=(at[1]*60+ +at[2])*6e4-(Date.now()+K)%D;
function $(i){return document.getElementById(i)}
function p(n){return(n<10?'0':'')+n}
function f(n){var h=n/60|0,m=n%60;return h?h+'시간'+(m?' '+m+'분':''):m+'분'}
function tick(){
var m=((Date.now()+K+off)%D+D)%D/6e4|0,o=m>=O&&m<C;
H.classList.toggle('day',m>=480&&m<1080);H.classList.toggle('now',o);
if(!first)H.classList.toggle('open',o);
$('hh').textContent=p(m/60|0);$('mm').textContent=p(m%60);
$('msg').textContent=o?'영업 중 · PM 5:00 마감까지 '+f(C-m):(m<O?'오늘':'내일')+' AM 10:00 오픈까지 '+f((O-m+1440)%1440);
}
tick();
setTimeout(function(){H.classList.add('ready')},50);
setTimeout(function(){first=0;tick()},700);
setInterval(tick,1000);
})();
</script>
