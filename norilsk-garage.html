<style>
html,body{margin:0;height:100%;overflow:hidden;background:#c5ccda}
svg{display:block;width:100%;height:100%;font-family:system-ui,sans-serif}
.ru{font-family:"Russo One",system-ui,sans-serif}
.hw{font-family:Caveat,cursive;font-weight:600}
.px{shape-rendering:crispEdges}
.nt{opacity:1}.day .nt{opacity:0}
.lit{opacity:0}.open .lit{opacity:1}.open .off{opacity:0}
.neon{fill:#4b2c22}.open .neon{fill:#ff4f14;filter:url(#gl)}
.bulb{stroke:#4b3a30}.open .bulb{stroke:#ffd27a;animation:chase 1s steps(2) infinite}
.ready .nt,.ready .lit,.ready .off{transition:opacity 1.4s}
.ready .neon{transition:fill 1s}
.ready .sh{transition:transform 4.6s cubic-bezier(.55,0,.35,1)}
.open .sh{transform:translateY(-448px)}
.open .tb{animation:fk 1.4s steps(1)}
.snow,.snow:after{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 7px 9px,#fff 1.2px,#0000 1.9px) 0 0/37px 41px,radial-gradient(circle at 21px 3px,#fffc 1px,#0000 1.7px) 0 0/53px 47px;animation:fa 7s linear infinite}
.snow:after{content:"";background:radial-gradient(circle at 13px 11px,#fff 1.8px,#0000 2.7px) 0 0/71px 67px;animation:fb 5s linear infinite}
@keyframes fa{to{background-position:20px 41px,-12px 47px}}
@keyframes fb{to{background-position:16px 67px}}
@keyframes chase{50%{stroke-dashoffset:5}}
@keyframes fk{0%,14%,34%{opacity:.15}7%,24%,50%{opacity:1}}
</style>
</head>

<script>
(function(){
var H=document.documentElement,O=600,C=1020,K=324e5,D=864e5,off=0,live=0,
at=/^(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('at')||'');
if(at)off=(at[1]*60+ +at[2])*6e4-(Date.now()+K)%D;
function r(id,a){document.getElementById(id).setAttribute('transform','rotate('+a+' 84 240)')}
function tick(){
var s=((Date.now()+K+off)%D+D)%D/1e3|0,m=s/60|0,o=m>=O&&m<C;
H.classList.toggle('day',m>=480&&m<1080);
if(live)H.classList.toggle('open',o);
r('ch',m%720*.5);r('cm',s%3600*.1);r('cs',s%60*6);
return o;
}
H.classList.toggle('open',!tick());
requestAnimationFrame(function(){requestAnimationFrame(function(){H.classList.add('ready')})});
setTimeout(function(){live=1;tick()},900);
setInterval(tick,1000);
})();
</script>
